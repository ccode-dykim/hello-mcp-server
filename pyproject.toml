[project]
name = "hello-mcp-server"
version = "0.1.2"
description = "나의 첫 MCP 서버"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10.1,<2.0.0",   # ← FastMCP 경로가 살아있는 마지막 안전 범위
]

[project.scripts]
hello-mcp-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]